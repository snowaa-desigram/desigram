# E2E: поднять весь стек из сабмодулей и прогнать scripts/e2e.sh.
# Первый прогон долгий (grpc-расширение PHP собирается из исходников), дальше слои берутся из GHA-кеша.
name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE: docker compose -f enviropment/docker-compose.yml -f enviropment/docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # для приватных сабмодулей: PAT с правом repo в secrets.SUBMODULES_TOKEN
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - run: cp enviropment/.env.example enviropment/.env

      - uses: docker/setup-buildx-action@v3

      - name: Build images (GHA layer cache)
        uses: docker/bake-action@v5
        with:
          source: .
          files: |
            enviropment/docker-compose.yml
            enviropment/docker-compose.dev.yml
          targets: core,core-worker,ping,telegram
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Start stack (без frontend/traefik/metrika)
        run: $COMPOSE up -d --no-build --wait --wait-timeout 180 core core-worker ping telegram

      - run: ./scripts/e2e.sh

      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --tail 200

      - if: always()
        run: $COMPOSE down -v
