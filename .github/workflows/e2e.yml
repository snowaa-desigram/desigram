# E2E: поднять весь стек из сабмодулей и прогнать scripts/e2e.sh.
# Первый прогон долгий (grpc-расширение PHP собирается из исходников), дальше слои берутся из GHA-кеша.
name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE: docker compose -f enviropment/docker-compose.yml -f enviropment/docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # для приватных сабмодулей: PAT с правом repo в secrets.SUBMODULES_TOKEN
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - run: cp enviropment/.env.example enviropment/.env

      - uses: docker/setup-buildx-action@v3

      - name: Build images (GHA layer cache)
        uses: docker/bake-action@v6
        with:
          source: .
          workdir: enviropment   # include: и контексты в compose — относительно этой папки
          files: |
            docker-compose.yml
            docker-compose.dev.yml
          targets: core,ping,telegram,auth
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Start stack (без frontend/traefik/metrika)
        run: $COMPOSE up -d --no-build --wait --wait-timeout 180 core core-worker ping telegram auth mailpit

      - run: ./scripts/e2e.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::docker compose ps -a"; $COMPOSE ps -a; echo "::endgroup::"
          for s in core-worker core ping telegram auth auth-migrate mailpit rabbitmq; do
            echo "::group::logs $s"; $COMPOSE logs --tail 100 $s; echo "::endgroup::"
          done

      - if: always()
        run: $COMPOSE down -v
